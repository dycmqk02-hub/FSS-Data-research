name: FSS Notify Check

# PC 전원 상태와 무관하게 매일 정해진 시각에 새 글을 확인해 이메일로 알려주는 워크플로우.
# cron은 UTC 기준이라 '0 0 * * *' = 매일 UTC 00:00 = 한국시간(KST) 09:00.
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run notification check
        shell: pwsh
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: ./cloud/CloudNotify.ps1

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cloud/notify-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update notification state"
            git push
          else
            echo "상태 변경 없음 - 커밋 생략"
          fi
